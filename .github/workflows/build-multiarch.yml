name: Production Multi-Arch Benchmark (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: buildah-multiarch-demo
  DOCKERHUB_NAMESPACE: shivam718

jobs:
  buildah:
    name: Buildah production benchmark
    runs-on: ubuntu-24.04
    outputs:
      cold_seconds: ${{ steps.buildah_cold_timer.outputs.seconds }}
      warm_seconds: ${{ steps.buildah_warm_timer.outputs.seconds }}
      publish_seconds: ${{ steps.buildah_publish_timer.outputs.seconds }}
      total_seconds: ${{ steps.buildah_total_timer.outputs.seconds }}

    steps:
      - name: Start Buildah total timer
        id: buildah_total_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install QEMU emulation
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static

      - name: Start Buildah cold-build timer
        id: buildah_cold_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cold build with Buildah
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: buildah-cold-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          containerfiles: ./Containerfile
          context: .
          oci: false
          layers: true
          extra-args: |
            --pull-always

      - name: Finish Buildah cold-build timer
        id: buildah_cold_timer
        env:
          START_EPOCH: ${{ steps.buildah_cold_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Simulate a source-only production change
        run: printf '%s\n' "${GITHUB_SHA}-warm" > benchmark-version.txt

      - name: Start Buildah warm-build timer
        id: buildah_warm_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Warm incremental build with Buildah
        id: buildah_warm
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: buildah-latest buildah-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          containerfiles: ./Containerfile
          context: .
          oci: false
          layers: true

      - name: Finish Buildah warm-build timer
        id: buildah_warm_timer
        env:
          START_EPOCH: ${{ steps.buildah_warm_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Inspect Buildah image manifest
        run: buildah manifest inspect "${{ steps.buildah_warm.outputs.image }}:buildah-latest"

      - name: Start Buildah publish timer
        if: github.event_name != 'pull_request'
        id: buildah_publish_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Publish Buildah manifest to Docker Hub
        id: buildah_publish
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.buildah_warm.outputs.image }}
          tags: ${{ steps.buildah_warm.outputs.tags }}
          registry: docker.io/${{ env.DOCKERHUB_NAMESPACE }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Finish Buildah publish timer
        if: github.event_name != 'pull_request'
        id: buildah_publish_timer
        env:
          START_EPOCH: ${{ steps.buildah_publish_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Smoke-test Buildah image
        if: github.event_name != 'pull_request'
        run: |
          container_id="$(podman run --detach --publish 18080:8080 \
            "${{ steps.buildah_warm.outputs.image }}:buildah-latest")"
          trap 'podman rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18080/api/info

      - name: Show Buildah published digest
        if: github.event_name != 'pull_request'
        run: echo "Published digest ${{ steps.buildah_publish.outputs.digest }}"

      - name: Finish Buildah total timer
        id: buildah_total_timer
        if: always()
        env:
          START_EPOCH: ${{ steps.buildah_total_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

  buildx:
    name: Buildx production benchmark
    runs-on: ubuntu-24.04
    outputs:
      cold_seconds: ${{ steps.buildx_cold_timer.outputs.seconds }}
      warm_seconds: ${{ steps.buildx_warm_timer.outputs.seconds }}
      publish_seconds: ${{ steps.buildx_publish_timer.outputs.seconds }}
      total_seconds: ${{ steps.buildx_total_timer.outputs.seconds }}

    steps:
      - name: Start Buildx total timer
        id: buildx_total_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Buildx cold-build timer
        id: buildx_cold_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cold build with Buildx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: true
          provenance: false
          sbom: false
          tags: local/buildx-cold:${{ github.sha }}

      - name: Finish Buildx cold-build timer
        id: buildx_cold_timer
        env:
          START_EPOCH: ${{ steps.buildx_cold_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Simulate a source-only production change
        run: printf '%s\n' "${GITHUB_SHA}-warm" > benchmark-version.txt

      - name: Start Buildx warm-build timer
        id: buildx_warm_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Warm incremental build with Buildx
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: false
          pull: false
          provenance: false
          sbom: false
          tags: local/buildx-warm:${{ github.sha }}

      - name: Finish Buildx warm-build timer
        id: buildx_warm_timer
        env:
          START_EPOCH: ${{ steps.buildx_warm_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Start Buildx publish timer
        if: github.event_name != 'pull_request'
        id: buildx_publish_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Publish cached Buildx image to Docker Hub
        id: buildx_publish
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: false
          provenance: false
          sbom: false
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-${{ github.sha }}

      - name: Finish Buildx publish timer
        if: github.event_name != 'pull_request'
        id: buildx_publish_timer
        env:
          START_EPOCH: ${{ steps.buildx_publish_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Inspect Buildx published manifest
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect \
            "docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-latest"

      - name: Smoke-test Buildx image
        if: github.event_name != 'pull_request'
        run: |
          container_id="$(docker run --detach --publish 18081:8080 \
            "docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-latest")"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in {1..15}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:18081/api/info

      - name: Show Buildx published digest
        if: github.event_name != 'pull_request'
        run: echo "Published digest ${{ steps.buildx_publish.outputs.digest }}"

      - name: Finish Buildx total timer
        id: buildx_total_timer
        if: always()
        env:
          START_EPOCH: ${{ steps.buildx_total_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

  comparison:
    name: Compare production benchmark timings
    if: always()
    needs:
      - buildah
      - buildx
    runs-on: ubuntu-24.04

    steps:
      - name: Write benchmark summary
        env:
          BUILDAH_RESULT: ${{ needs.buildah.result }}
          BUILDX_RESULT: ${{ needs.buildx.result }}
          BUILDAH_COLD: ${{ needs.buildah.outputs.cold_seconds }}
          BUILDAH_WARM: ${{ needs.buildah.outputs.warm_seconds }}
          BUILDAH_PUBLISH: ${{ needs.buildah.outputs.publish_seconds }}
          BUILDAH_TOTAL: ${{ needs.buildah.outputs.total_seconds }}
          BUILDX_COLD: ${{ needs.buildx.outputs.cold_seconds }}
          BUILDX_WARM: ${{ needs.buildx.outputs.warm_seconds }}
          BUILDX_PUBLISH: ${{ needs.buildx.outputs.publish_seconds }}
          BUILDX_TOTAL: ${{ needs.buildx.outputs.total_seconds }}
        run: |
          buildah_cold="${BUILDAH_COLD:-0}"
          buildah_warm="${BUILDAH_WARM:-0}"
          buildah_publish="${BUILDAH_PUBLISH:-0}"
          buildah_delivery=$((buildah_warm + buildah_publish))

          buildx_cold="${BUILDX_COLD:-0}"
          buildx_warm="${BUILDX_WARM:-0}"
          buildx_publish="${BUILDX_PUBLISH:-0}"
          buildx_delivery=$((buildx_warm + buildx_publish))

          {
            echo "## Production-style multi-architecture benchmark"
            echo
            echo "Both jobs used the same runner image, five-stage Containerfile, and target platforms."
            echo
            echo "| Engine | Result | Cold build | Warm rebuild | Publish | Code-change delivery | Total job steps |"
            echo "| --- | --- | ---: | ---: | ---: | ---: | ---: |"
            echo "| Buildah | ${BUILDAH_RESULT} | ${buildah_cold}s | ${buildah_warm}s | ${buildah_publish}s | ${buildah_delivery}s | ${BUILDAH_TOTAL:-0}s |"
            echo "| Buildx | ${BUILDX_RESULT} | ${buildx_cold}s | ${buildx_warm}s | ${buildx_publish}s | ${buildx_delivery}s | ${BUILDX_TOTAL:-0}s |"
            echo
            echo "Code-change delivery is warm rebuild plus registry publication."

            if [ "$buildah_cold" -gt 0 ] && [ "$buildx_cold" -gt 0 ]; then
              if [ "$buildah_cold" -lt "$buildx_cold" ]; then
                echo "Cold build: Buildah was $((buildx_cold - buildah_cold))s faster."
              elif [ "$buildx_cold" -lt "$buildah_cold" ]; then
                echo "Cold build: Buildx was $((buildah_cold - buildx_cold))s faster."
              else
                echo "Cold build: both completed in the same number of seconds."
              fi
            fi

            if [ "$buildah_delivery" -gt 0 ] && [ "$buildx_delivery" -gt 0 ]; then
              if [ "$buildah_delivery" -lt "$buildx_delivery" ]; then
                echo "Code-change delivery: Buildah was $((buildx_delivery - buildah_delivery))s faster."
              elif [ "$buildx_delivery" -lt "$buildah_delivery" ]; then
                echo "Code-change delivery: Buildx was $((buildah_delivery - buildx_delivery))s faster."
              else
                echo "Code-change delivery: both completed in the same number of seconds."
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
