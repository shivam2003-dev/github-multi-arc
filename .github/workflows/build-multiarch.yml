name: Multi-Arch Buildah vs Buildx

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: buildah-multiarch-demo
  DOCKERHUB_NAMESPACE: shivam718

jobs:
  buildah:
    name: Buildah - linux/amd64 and linux/arm64
    runs-on: ubuntu-24.04
    outputs:
      build_seconds: ${{ steps.buildah_build_timer.outputs.seconds }}
      push_seconds: ${{ steps.buildah_push_timer.outputs.seconds }}
      total_seconds: ${{ steps.buildah_total_timer.outputs.seconds }}

    steps:
      - name: Start Buildah total timer
        id: buildah_total_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install QEMU emulation
        run: |
          sudo apt-get update
          sudo apt-get install --yes qemu-user-static

      - name: Start Buildah build timer
        id: buildah_build_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build multi-architecture image with Buildah
        id: buildah_build
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: buildah-latest buildah-${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          containerfiles: ./Containerfile
          context: .
          oci: true
          layers: true

      - name: Finish Buildah build timer
        id: buildah_build_timer
        env:
          START_EPOCH: ${{ steps.buildah_build_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Inspect Buildah image manifest
        run: buildah manifest inspect "${{ steps.buildah_build.outputs.image }}:buildah-latest"

      - name: Run Buildah native architecture image
        run: podman run --rm "${{ steps.buildah_build.outputs.image }}:buildah-latest"

      - name: Start Buildah push timer
        if: github.event_name != 'pull_request'
        id: buildah_push_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Push Buildah manifest to Docker Hub
        id: buildah_push
        if: github.event_name != 'pull_request'
        uses: redhat-actions/push-to-registry@v3
        with:
          image: ${{ steps.buildah_build.outputs.image }}
          tags: ${{ steps.buildah_build.outputs.tags }}
          registry: docker.io/${{ env.DOCKERHUB_NAMESPACE }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Finish Buildah push timer
        if: github.event_name != 'pull_request'
        id: buildah_push_timer
        env:
          START_EPOCH: ${{ steps.buildah_push_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Show Buildah published digest
        if: github.event_name != 'pull_request'
        run: echo "Published digest ${{ steps.buildah_push.outputs.digest }}"

      - name: Finish Buildah total timer
        id: buildah_total_timer
        if: always()
        env:
          START_EPOCH: ${{ steps.buildah_total_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

  buildx:
    name: Buildx - linux/amd64 and linux/arm64
    runs-on: ubuntu-24.04
    outputs:
      build_push_seconds: ${{ steps.buildx_engine_timer.outputs.seconds }}
      total_seconds: ${{ steps.buildx_total_timer.outputs.seconds }}

    steps:
      - name: Start Buildx total timer
        id: buildx_total_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Buildx engine timer
        id: buildx_engine_start
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image with Buildx
        id: buildx_build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          provenance: false
          sbom: false
          tags: |
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-latest
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-${{ github.sha }}

      - name: Finish Buildx engine timer
        id: buildx_engine_timer
        env:
          START_EPOCH: ${{ steps.buildx_engine_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

      - name: Inspect Buildx published manifest
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect \
            "docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-latest"

      - name: Run Buildx native architecture image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            "docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}:buildx-latest"

      - name: Show Buildx published digest
        if: github.event_name != 'pull_request'
        run: echo "Published digest ${{ steps.buildx_build.outputs.digest }}"

      - name: Finish Buildx total timer
        id: buildx_total_timer
        if: always()
        env:
          START_EPOCH: ${{ steps.buildx_total_start.outputs.epoch }}
        run: echo "seconds=$(( $(date +%s) - START_EPOCH ))" >> "$GITHUB_OUTPUT"

  comparison:
    name: Compare Buildah and Buildx timings
    if: always()
    needs:
      - buildah
      - buildx
    runs-on: ubuntu-24.04

    steps:
      - name: Write benchmark summary
        env:
          BUILDAH_RESULT: ${{ needs.buildah.result }}
          BUILDX_RESULT: ${{ needs.buildx.result }}
          BUILDAH_BUILD_SECONDS: ${{ needs.buildah.outputs.build_seconds }}
          BUILDAH_PUSH_SECONDS: ${{ needs.buildah.outputs.push_seconds }}
          BUILDAH_TOTAL_SECONDS: ${{ needs.buildah.outputs.total_seconds }}
          BUILDX_ENGINE_SECONDS: ${{ needs.buildx.outputs.build_push_seconds }}
          BUILDX_TOTAL_SECONDS: ${{ needs.buildx.outputs.total_seconds }}
        run: |
          buildah_build="${BUILDAH_BUILD_SECONDS:-0}"
          buildah_push="${BUILDAH_PUSH_SECONDS:-0}"
          buildah_engine=$((buildah_build + buildah_push))
          buildx_engine="${BUILDX_ENGINE_SECONDS:-0}"

          {
            echo "## Multi-architecture benchmark"
            echo
            echo "Both jobs used the same runner image, Containerfile, and target platforms."
            echo
            echo "| Engine | Result | Build + push | Total job steps |"
            echo "| --- | --- | ---: | ---: |"
            echo "| Buildah | ${BUILDAH_RESULT} | ${buildah_engine}s | ${BUILDAH_TOTAL_SECONDS:-0}s |"
            echo "| Buildx | ${BUILDX_RESULT} | ${buildx_engine}s | ${BUILDX_TOTAL_SECONDS:-0}s |"
            echo
            echo "Buildah breakdown: build ${buildah_build}s, push ${buildah_push}s."

            if [ "$buildah_engine" -gt 0 ] && [ "$buildx_engine" -gt 0 ]; then
              if [ "$buildah_engine" -lt "$buildx_engine" ]; then
                echo "Buildah was $((buildx_engine - buildah_engine))s faster in the timed engine phase."
              elif [ "$buildx_engine" -lt "$buildah_engine" ]; then
                echo "Buildx was $((buildah_engine - buildx_engine))s faster in the timed engine phase."
              else
                echo "Both timed engine phases completed in the same number of seconds."
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
